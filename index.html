<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N５日本語単語学習</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .progress-bar { width: 100%; height: 10px; background-color: #e0e0e0; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background-color: #28a745; transition: width 0.3s ease; }
        .question-box { margin: 20px 0; padding: 30px; background: #eef2f3; border-radius: 8px; }
        .answer-box { margin-top: 20px; font-size: 1.5rem; color: #d9534f; font-weight: bold; min-height: 2em; }
        button { width: 100%; padding: 15px; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; margin-top: 10px; }
        .action-btn { background-color: #28a745; }
        .next-btn { background-color: #007bff; }
        #header-msg { font-weight: bold; color: #333; margin-bottom: 5px; }
        #step-msg { font-size: 0.9rem; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>N５日本語単語学習<br><small style="font-size: 0.9rem;">(Pembelajaran kosakata bahasa Jepang)</small></h1>
    <div id="header-msg"></div>
    <div id="step-msg"></div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="quiz">
        <div class="question-box" id="q-area">読み込み中...</div>
        <div class="answer-box" id="a-area"></div>
        <button id="action-btn" class="action-btn" onclick="showAnswer()">①インドネシア語を見る<br>(Lihat Bahasa Indonesia)</button>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">②次の単語へ<br>(Kata selanjutnya)</button>
    </div>
</div>

<script>
    const DATA_FILE = 'japanesewords.json';
    let currentQuiz = [];
    let currentIndex = 0;

    async function init() {
        try {
            const response = await fetch(DATA_FILE);
            const data = await response.json();
            const allWords = data.words || data;

            const nouns = allWords.filter(w => w.category && w.category.includes('名詞'));
            const verbs = allWords.filter(w => w.category === '動詞');
            const adjs = allWords.filter(w => w.category && (w.category.includes('形容詞') || w.no >= 415));

            currentQuiz = [
                ...getRandom(nouns, 4),
                ...getRandom(verbs, 3),
                ...getRandom(adjs, 3)
            ].sort(() => Math.random() - 0.5);

            document.getElementById('header-msg').innerHTML = "単語学習10問をやってみましょう<br>(Mari kita coba 10 pertanyaan pembelajaran kosakata ini.)";
            showQuestion();
        } catch (e) {
            document.getElementById('q-area').innerHTML = "データの読み込みエラー";
        }
    }

    function getRandom(arr, n) {
        return [...arr].sort(() => 0.5 - Math.random()).slice(0, n);
    }

    function showQuestion() {
        if(currentIndex < currentQuiz.length) {
            const q = currentQuiz[currentIndex];
            // プログレスバー更新
            const progress = ((currentIndex + 1) / currentQuiz.length) * 100;
            document.getElementById('progress-fill').style.width = progress + "%";
            
            document.getElementById('step-msg').innerHTML = `第${currentIndex + 1}問 / ${currentQuiz.length} (Pertanyaan ${currentIndex + 1})`;
            document.getElementById('q-area').innerHTML = `
                <p>カテゴリー: ${q.category}</p>
                <h2>${q.kanji}</h2>
                <p>(${q.hiragana})</p>
            `;
            document.getElementById('a-area').innerHTML = "";
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerHTML = (currentIndex === currentQuiz.length - 1) ? "終了 (akhir)" : "②次の単語へ<br>(Kata selanjutnya)";
        } else {
            document.getElementById('header-msg').innerHTML = "";
            document.getElementById('step-msg').innerHTML = "";
            document.getElementById('progress-fill').style.width = "100%";
            document.getElementById('quiz').innerHTML = `
                <h2>お疲れさまでした！<br>(Kerja bagus semuanya!)</h2>
                <button class="next-btn" onclick="location.reload()">最初からやり直す (Mulai lagi)</button>
            `;
        }
    }

    function showAnswer() {
        document.getElementById('a-area').innerHTML = currentQuiz[currentIndex].indonesian;
    }

    function nextQuestion() {
        currentIndex++;
        showQuestion();
    }

    init();
</script>
</body>
</html>
